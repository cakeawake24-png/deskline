}

.lvc{height:110px;overflow:auto;margin:8px 0;font-size:14px}.lvc div{padding:2px 0}
@media(prefers-reduced-motion:reduce){.sfx i,.lvfl,.sfx.pulse i{animation:none}}

priv(){S.priv=S.priv?0:1;if(S.priv){setTimeout(()=>{S.reqs=['luz','mateo'].filter(x=>!S.reqs.includes(x));pushN('Tienes nuevas solicitudes de seguimiento')},1500)}toast(S.priv?'Cuenta privada activada':'Cuenta pública');render()},
nt(){S.notif=S.notif?0:1;if(!S.notif)S.unread=0;render()},
int(e){const t=e.dataset.t;S.int=S.int.includes(t)?S.int.filter(x=>x!==t):[...S.int,t];render()},
plan(e){S.plan=e.dataset.p;if(S.plan==='Gratis'){if(PROFX.includes(S.fx))S.fx='Normal';if(PROFX.includes(S.d.fx))S.d.fx='Normal'}toast('Plan '+S.plan+' activado (demostración, sin cobro)');render()},
ver(){S.ver='rev';render();setTimeout(()=>{S.ver='ok';pushN('Tu cuenta fue verificada ✓');toast('Cuenta verificada')},4000)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t)});
document.addEventListener('input',e=>{const i=e.target.id;if(i==='dt')S.d.t=e.target.value;else if(i==='dg')S.d.g=e.target.value;else if(i==='dp')S.d.p=e.target.value;else if(i==='sq')search()});
document.addEventListener('change',e=>{const i=e.target.id,f=e.target.files&&e.target.files[0];
if(i==='bio'){S.bio=e.target.value;render()}
else if(i==='df'&&f){if(BAD.test(f.name)){S.strikes++;S.d.err='Bloqueado: el archivo incumple las normas de contenido.';render();return}S.d.file={url:URL.createObjectURL(f),type:f.type.startsWith('video')?'v':'i',name:f.name};S.d.fx=S.d.fx||S.fx;S.d.err='';render()}
else if(i==='rf'&&f){if(BAD.test(f.name)){S.strikes++;toast('Bloqueado: el video incumple las normas');return}reels.unshift({id:Date.now(),u:'me',t:f.name.replace(/\.\w+$/,''),v:URL.createObjectURL(f),r:{},mine:[]});toast('Reel subido');render()}
else if(i==='af'&&f){if(BAD.test(f.name)){toast('Bloqueado');return}S.stimg=URL.createObjectURL(f);$('#afn').textContent=f.name}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mi')A.send();if(e.key==='Enter'&&e.target.id==='cn')A.mkch()});
